<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>时代序列 · 日本历史地图</title>
  <meta name="description" content="按日期浏览日本历史势力范围、时代变迁、纪年对照与争议地区。示意疆域，不作主权裁决。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="atlas-shell">
    <header id="nav-bar">
      <div class="brand-group">
        <a class="home-link" href="./" data-i18n="brand.homeAria" data-i18n-attr="aria-label">
          <h1>
            <span class="seal-mark">時</span>
            <span class="brand-title" data-i18n="brand.title">时代序列</span>
          </h1>
        </a>
        <p class="brand-sub" data-i18n="brand.sub">日本历史地图时间轴 · 示意疆域</p>
      </div>

      <div class="chrono-panel" aria-live="polite">
        <div class="chrono-row" id="chrono-gregorian">—</div>
        <div class="chrono-row" id="chrono-japan">—</div>
        <div class="chrono-row" id="chrono-china">—</div>
        <div class="chrono-row muted" id="chrono-period">—</div>
      </div>

      <div class="nav-actions">
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" class="lang-btn" data-lang="zh" aria-pressed="false">中</button>
          <button type="button" class="lang-btn" data-lang="ja" aria-pressed="false">日</button>
          <button type="button" class="lang-btn" data-lang="en" aria-pressed="false">EN</button>
        </div>
        <span id="engine-tag" class="engine-tag">引擎 · —</span>
        <label class="year-jump">
          <span data-i18n="nav.jump">跳转</span>
          <input id="year-input" type="number" inputmode="numeric" step="1" />
        </label>
        <button type="button" id="btn-today" class="ghost-btn" data-i18n="nav.today">今天</button>
        <button type="button" id="btn-play" class="ghost-btn" aria-pressed="false" data-i18n="nav.play">播放</button>
      </div>
    </header>

    <main id="stage">
      <aside id="legend-card" class="glass-card">
        <h2 data-i18n="legend.title">图例</h2>
        <ul id="legend-list"></ul>
        <p class="hint" data-i18n="legend.hint">色块为示意范围；斜线表示争夺、双重从属或争议对照。</p>
      </aside>

      <section id="map-wrap" aria-label="日本历史地图">
        <div id="map-host"></div>
        <div id="map-hint" data-i18n="map.hint">拖动平移 · 滚轮缩放 · 点击色块或标记</div>
      </section>

      <aside id="inspector" class="glass-card" hidden>
        <button type="button" id="inspector-close" class="icon-btn" data-i18n="inspector.close" data-i18n-attr="aria-label">×</button>
        <h2 id="inspector-title" data-i18n="inspector.details">详情</h2>
        <div id="inspector-meta" class="meta-line"></div>
        <p id="inspector-body"></p>
        <ul id="inspector-parties"></ul>
      </aside>
    </main>

    <footer id="timeline">
      <div class="phase-label" id="phase-label">—</div>
      <div class="timeline-track">
        <input id="year-slider" type="range" />
        <div id="period-ticks" aria-hidden="true"></div>
      </div>
      <div class="timeline-ends">
        <span id="year-min-label"></span>
        <span id="year-max-label"></span>
      </div>
      <p class="disclaimer" data-i18n="disclaimer">本页疆域为学习用示意复原；争议地区并列各方说法，不作主权裁决。史实主轴对齐维基百科。</p>
    </footer>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
